settings:
  debug: false
  bungeecord: false
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
messages:
  restart: "StormPeak Survival se zaganja..."
world-settings:
  default:
    verbose: false
    item-despawn-rate: 6000
    mob-spawn-range: 6
    merge-radius:
      item: 2.5
      exp: 3.0
    anti-xray:
      enabled: true
      engine-mode: 1
      max-block-height: 64
      update-radius: 2
      hidden-blocks:
        - gold_ore
        - iron_ore
        - coal_ore
        - diamond_ore
        - emerald_ore
        - redstone_ore
        - lapis_ore
        - ancient_debris
