# IridiumSkyblock - StormPeak Skyblock

island:
  size: 100
  distance: 200
  height: 100
  starting-schematic: starter
  
  settings:
    pvp:
      enabled: false
      defaultValue: false
    mob-spawning:
      enabled: true
      defaultValue: true
    leaf-decay:
      enabled: true
      defaultValue: true
    fire-spread:
      enabled: false
      defaultValue: false
